name: CI

on:  
  push:
    branches: [main]

jobs:
  build_scan_push:
    runs_on: self-hosted
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions.checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.HARBOR_URL }}/dashboard/dashboard-${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.HARBOR_URL }}/dashboard/dashboard-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push image to Harbor
        run: |
         docker push ${{ secrets.HARBOR_URL }}/dashboard/dashboard-${{ matrix.service }}:${{ github.sha }} 


