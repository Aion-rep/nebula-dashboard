# A ConfigMap stores non-sensitive configuration data as key-value pairs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: dashboard
  labels:
    app.kubernetes.io/part-of: dashboard
data:
  DB_HOST: "mariadb"
  DB_PORT: "3306"
  DB_NAME: "nebula"
  DB_USER: "nebula"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_TTL: "30"
